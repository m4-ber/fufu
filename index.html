<title>每日任务</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0b0d10;--card:#15181e;--card2:#1b1f27;--line:#23272f;
  --text:#e9ebee;--muted:#878e9a;--accent:#4ade80;
}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:contain;
  user-select:none;-webkit-user-select:none;
}
body::before{
  content:'';position:fixed;top:-220px;left:50%;transform:translateX(-50%);
  width:620px;height:620px;border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(circle,rgba(74,222,128,.10),transparent 70%);
}
main{
  position:relative;z-index:1;max-width:480px;margin:0 auto;width:100%;
  padding:calc(env(safe-area-inset-top) + 24px) 18px calc(env(safe-area-inset-bottom) + 96px);
}
.hidden{display:none !important}

.head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px}
.date{font-size:22px;font-weight:700;letter-spacing:.3px}
.streak{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:4px}
.streak .flame{font-size:14px}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.card-sub{font-size:13px;color:var(--muted);margin-bottom:12px;font-weight:600}
.title{font-size:18px;font-weight:700;margin:0 0 16px}
.note{font-size:13px;color:var(--muted);line-height:1.7;margin:0 0 10px}
.note:last-child{margin-bottom:0}

.progress-card{margin-bottom:18px}
.progress-head{
  display:flex;justify-content:space-between;align-items:baseline;
  font-size:13px;color:var(--muted);margin-bottom:11px;
}
.progress-head span:last-child{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:5px;background:#22262e;overflow:hidden}
.bar-fill{
  height:100%;width:0;border-radius:5px;
  background:linear-gradient(90deg,#22c55e,#4ade80);
  transition:width .45s cubic-bezier(.4,0,.2,1);
}

.cat-card{
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:15px 14px 10px;margin-bottom:12px;
}
.cat-head{display:flex;align-items:center;gap:9px;margin-bottom:10px;padding:0 2px}
.cat-icon{font-size:17px;line-height:1}
.cat-name{font-size:15px;font-weight:700;letter-spacing:.2px}
.cat-progress{
  margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;
  background:var(--card2);padding:3px 9px;border-radius:8px;border:1px solid var(--line);
}
.mini-bar{height:4px;border-radius:2px;background:#22262e;overflow:hidden;margin:0 2px 12px}
.mini-bar i{display:block;height:100%;background:var(--cat-color);border-radius:2px;transition:width .3s ease}

.task-list{list-style:none;margin:0;padding:0}
.task{
  display:flex;align-items:center;gap:12px;
  background:var(--card2);border:1px solid var(--line);border-radius:13px;
  padding:12px 12px;margin-bottom:7px;
  transition:background .18s ease,border-color .18s ease;
}
.check{
  width:23px;height:23px;border-radius:50%;flex-shrink:0;position:relative;
  border:2px solid #3a4049;transition:all .18s ease;cursor:pointer;
}
.task.done .check{background:var(--cat-color);border-color:var(--cat-color)}
.task.done .check::after{
  content:'';position:absolute;left:6px;top:3px;width:6px;height:10px;
  border:solid #0b0d10;border-width:0 2.5px 2.5px 0;transform:rotate(45deg);
}
.task.done .task-text{color:var(--muted);text-decoration:line-through;text-decoration-color:#4b5563}
.task.done{background:rgba(255,255,255,.035);border-color:rgba(255,255,255,.10)}
@supports (background: color-mix(in srgb, red 10%, blue)) {
  .task.done{
    background:color-mix(in srgb,var(--cat-color) 12%,var(--card2));
    border-color:color-mix(in srgb,var(--cat-color) 32%,var(--line));
  }
}
.task-text{font-size:15px;line-height:1.45;flex:1;word-break:break-word;cursor:text}
.edit-input{
  flex:1;min-width:0;background:var(--card);border:1px solid var(--cat-color);
  border-radius:8px;color:var(--text);font-size:15px;padding:6px 8px;
  font-family:inherit;outline:none;-webkit-appearance:none;
  user-select:text;-webkit-user-select:text;
}
.del{
  width:24px;height:24px;border-radius:50%;border:none;background:transparent;
  color:#5b6472;font-size:17px;line-height:1;flex-shrink:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;
  font-family:inherit;
}
.del:active{background:rgba(255,255,255,.09);color:#f87171}
.empty{color:#6b7280;font-size:13px;text-align:center;padding:12px 0 14px;list-style:none}

.add-row{margin:2px 0 6px}
.add-btn{
  width:100%;padding:11px;border-radius:12px;cursor:pointer;font-family:inherit;
  background:transparent;border:1px dashed #313742;color:var(--muted);
  font-size:14px;font-weight:600;transition:all .16s ease;
}
.add-btn:active{background:rgba(255,255,255,.04);color:var(--text)}
.add-form{display:flex;gap:8px}
.add-form input{
  flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);
  border-radius:12px;color:var(--text);font-size:16px;padding:11px 13px;
  font-family:inherit;outline:none;-webkit-appearance:none;user-select:text;-webkit-user-select:text;
}
.add-form input:focus{border-color:rgba(74,222,128,.5)}
.add-confirm{
  flex-shrink:0;padding:0 18px;border:none;border-radius:12px;cursor:pointer;
  background:var(--cat-color);color:#0b0d10;font-size:14px;font-weight:700;font-family:inherit;
}
.add-confirm:active{opacity:.8}

.hint{color:var(--muted);font-size:13px;line-height:1.6;text-align:center;margin:14px 0 0}

.ycard{padding:16px}
.yhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ytitle{font-size:14px;font-weight:700}
.ytoggle{font-size:12px;font-weight:600;color:var(--accent)}
.ynone{color:var(--muted);font-size:13px;margin:0;padding:2px 0 6px}
.yrow{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted);margin-bottom:8px}
.ypct{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.ybar .bar-fill{background:linear-gradient(90deg,#3b82f6,#60a5fa)}
.ycats{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.ychip{
  font-size:11px;padding:4px 9px;border-radius:8px;
  background:var(--card2);border:1px solid var(--line);color:var(--muted);
}
.ydetail{margin-top:14px;border-top:1px solid var(--line);padding-top:4px}
.yd-cat{font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 6px}
.yd-item{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 0;color:var(--text);line-height:1.4}
.yd-item.done{color:#6b7280;text-decoration:line-through;text-decoration-color:#3f4652}
.yd-dot{width:6px;height:6px;border-radius:50%;background:var(--c);flex-shrink:0}

.big-stat{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.big-num{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums}
.big-num i{font-size:18px;font-style:normal;font-weight:700;color:var(--muted);margin-left:2px}
.big-desc{font-size:13px;color:var(--muted);line-height:1.4}

.cmp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cmp-head > span:first-child{font-size:13px;color:var(--muted);font-weight:600}
.cmp-badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:9px;white-space:nowrap}
.cmp-badge.up{color:#4ade80;background:rgba(74,222,128,.12)}
.cmp-badge.down{color:#f87171;background:rgba(248,113,113,.12)}
.cmp-badge.same{color:var(--muted);background:var(--card2)}
.cmp-row{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.cmp-label{font-size:12px;color:var(--muted);width:60px;flex-shrink:0}
.cmp-row .bar{flex:1}
.cmp-row .bar.last .bar-fill{background:#475569}
.cmp-pct{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;width:38px;text-align:right;flex-shrink:0}
.cmp-note{font-size:11px;color:#5f6773;margin-top:12px;text-align:center}

.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wday{text-align:center;padding:2px 0}
.wday.future{opacity:.35}
.wd-label{font-size:11px;color:var(--muted);margin-bottom:6px}
.wday.today .wd-label{color:var(--accent);font-weight:700}
.ring{
  width:40px;height:40px;border-radius:50%;margin:0 auto;position:relative;
  background:conic-gradient(var(--c) calc(var(--p) * 1%), #23272f 0);
  display:flex;align-items:center;justify-content:center;
}
.wday.today .ring{box-shadow:0 0 0 2px rgba(74,222,128,.35)}
.ring::before{content:'';position:absolute;inset:5px;border-radius:50%;background:var(--card)}
.ring span{position:relative;z-index:1;font-size:9px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.wd-num{font-size:10px;color:#5f6773;margin-top:5px;height:12px;font-variant-numeric:tabular-nums}

.hist-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hist-label{font-size:11px;color:var(--muted);width:96px;flex-shrink:0;font-variant-numeric:tabular-nums}
.hist-bar{flex:1;height:6px;border-radius:3px;background:#22262e;overflow:hidden}
.hist-bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#22c55e,#4ade80);transition:width .3s ease}
.hist-pct{font-size:11px;font-weight:700;width:36px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}

.btn{
  width:100%;padding:15px;border:none;border-radius:14px;cursor:pointer;
  background:var(--accent);color:#07130b;font-size:16px;font-weight:700;font-family:inherit;
  transition:opacity .15s ease;
}
.btn:active{opacity:.8}
.btn.danger{background:rgba(248,113,113,.14);color:#f87171;border:1px solid rgba(248,113,113,.3)}
.btn.danger:active{opacity:.7}
.btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.secondary:active{background:#22262e}
.btn + .btn{margin-top:10px}

.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;gap:8px;
  justify-content:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:rgba(11,13,16,.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line);
}
.tabbar button{

/* 长按操作菜单 */

.sheet hr{border:none;border-top:1px solid var(--line);margin:4px 8px}
.sheet .muted{color:var(--muted)}

/* 日期编辑弹层 */
.modal{
  position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 16px);
  bottom:calc(12px + env(safe-area-inset-bottom));z-index:31;margin:0 auto;max-width:456px;
  background:var(--bg);border:1px solid var(--line);border-radius:20px;

.modal-head{

.modal-title{font-size:17px;font-weight:700}
.modal-close,.sort-banner button{
  background:var(--accent);color:#07130b;border:none;border-radius:10px;
  padding:8px 16px;font-weight:700;font-family:inherit;font-size:13px;cursor:pointer;
}

/* 排序模式 */
.sort-banner{
  position:fixed;top:0;left:0;right:0;z-index:25;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;

}
.sort-banner.show{transform:none}
.sort-banner span{flex:1;font-size:13px;color:var(--text);font-weight:600}
body.sorting .task{touch-action:none;cursor:grab}
body.sorting .check,body.sorting .del,body.sorting .task-text,
body.sorting .add-row,body.sorting .tabbar{pointer-events:none}
body.sorting .tabbar{opacity:.45}
.task.dragging{
  opacity:.94;border-color:var(--cat-color);z-index:5;position:relative;
  box-shadow:0 10px 28px rgba(0,0,0,.5);transition:none;
}

/* 周报可点日期 */

.wday.future.pickable{opacity:1}
.wday.pickable .wd-label::after{content:"\270E";font-size:9px;color:var(--accent);font-style:normal}
</style>

<script>
// PWA：注册离线缓存 + iOS「添加到主屏幕」引导
(function () {
  'use strict';
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
  var icon = document.querySelector('link[rel="apple-touch-icon"]');
  if (icon) { try { icon.href = new URL('apple-touch-icon.png', location.href.replace(/index\.html$/, '')).href; } catch (e) {} }
  var isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var standalone = window.navigator.standalone === true ||
    window.matchMedia('(display-mode: standalone)').matches;
  var tip = document.getElementById('pwaTip');
  var closed = false;
  try { closed = localStorage.getItem('pwa_tip_closed') === '1'; } catch (e) {}
  if (isIOS && !standalone && !closed && tip) {
    tip.classList.remove('hidden');
    var btn = document.getElementById('pwaTipClose');
    if (btn) {
      btn.addEventListener('click', function () {
        tip.classList.add('hidden');
        try { localStorage.setItem('pwa_tip_closed', '1'); } catch (e) {}
      });
    }
  }
})();
</script>

<script>
(function () {
  'use strict';

  var KEY = 'daily_quest_v3';

  var CATS = [
    { id: 'exercise', name: '健康', icon: '💪', color: '#fb923c' },
    { id: 'study',    name: '学习', icon: '📚', color: '#60a5fa' },
    { id: 'task',     name: '任务', icon: '✅', color: '#4ade80' },
    { id: 'other',    name: '其他', icon: '✨', color: '#c084fc' }
  ];

  var WEEK_CN = ['日', '一', '二', '三', '四', '五', '六'];

  var state = load();
  var lastKey = null;
  var yesterdayOpen = false;
  var currentTab = 'today';

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && s.days && typeof s.days === 'object') return s;
      }
    } catch (e) {}
    return { days: {} };
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  function prune() {
    var keys = Object.keys(state.days).sort();
    if (keys.length > 300) {
      keys.slice(0, keys.length - 300).forEach(function (k) { delete state.days[k]; });
    }
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }

  function dayKey(d) {
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  function addDays(d, n) {
    var x = new Date(d);
    x.setDate(x.getDate() + n);
    return x;
  }

  function startOfWeek(d) {
    var x = new Date(d);
    x.setHours(12, 0, 0, 0);
    var g = x.getDay();
    x.setDate(x.getDate() + (g === 0 ? -6 : 1 - g));
    return x;
  }

  function fmtDate(d) { return (d.getMonth() + 1) + '月' + d.getDate() + '日'; }
  function fmtDateWeek(d) { return fmtDate(d) + ' · 周' + WEEK_CN[d.getDay()]; }
  function fmtShort(d) { return (d.getMonth() + 1) + '/' + d.getDate(); }

  function emptyDay() {
    var d = {};
    CATS.forEach(function (c) { d[c.id] = []; });
    return d;
  }

  function getDayData(key, create) {
    var d = state.days[key];
    if (!d) {
      if (!create) return null;
      d = {};
      CATS.forEach(function (c) { d[c.id] = []; });
      state.days[key] = d;
      prune();
      return d;
    }
    CATS.forEach(function (c) {
      if (!Array.isArray(d[c.id])) d[c.id] = [];
    });
    return d;
  }

  function ensureDay(key) { return getDayData(key, true); }

  function dayStats(d) {
    var total = 0, done = 0;
    if (!d) return { total: 0, done: 0 };
    for (var i = 0; i < CATS.length; i++) {
      var arr = d[CATS[i].id];
      if (!Array.isArray(arr)) continue;
      total += arr.length;
      for (var j = 0; j < arr.length; j++) {
        if (arr[j] && arr[j].done) done++;
      }
    }
    return { total: total, done: done };
  }

  function sumRange(start, end) {
    var total = 0, done = 0;
    var d = new Date(start);
    d.setHours(12, 0, 0, 0);
    var e = new Date(end);
    e.setHours(12, 0, 0, 0);
    while (d <= e) {
      var s = dayStats(getDayData(dayKey(d), false));
      total += s.total;
      done += s.done;
      d = addDays(d, 1);
    }
    return { total: total, done: done };
  }

  function calcStreak() {
    var n = 0;
    var d = new Date();
    d.setHours(12, 0, 0, 0);
    var ts = dayStats(getDayData(dayKey(d), false));
    if (!(ts.total && ts.done === ts.total)) d = addDays(d, -1);
    while (true) {
      var s = dayStats(getDayData(dayKey(d), false));
      if (s.total && s.done === s.total) {
        n++;
        d = addDays(d, -1);
      } else break;
    }
    return n;
  }

  var dateEl = document.getElementById('dateText');
  var streakNum = document.getElementById('streakNum');
  var progressText = document.getElementById('progressText');
  var barFill = document.getElementById('barFill');
  var catList = document.getElementById('catList');
  var hintText = document.getElementById('hintText');
  var yesterdayCard = document.getElementById('yesterdayCard');
  var weekContent = document.getElementById('weekContent');
  var toastEl = document.getElementById('toast');

  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2000);
  }

  function vibrate(p) {
    if (navigator.vibrate) { try { navigator.vibrate(p); } catch (e) {} }
  }

  function renderToday() {
    var now = new Date();
    var key = dayKey(now);
    lastKey = key;

    dateEl.textContent = fmtDateWeek(now);

    var day = getDayData(key, false) || emptyDay();
    var stats = dayStats(day);
    var pct = stats.total ? Math.round(stats.done / stats.total * 100) : 0;

    progressText.textContent = stats.done + ' / ' + stats.total + ' · ' + (stats.total ? pct + '%' : '—');
    barFill.style.width = pct + '%';
    streakNum.textContent = calcStreak();

    if (!stats.total) {
      hintText.textContent = '今天还没有任务，在下方板块中添加吧';
    } else if (stats.done === stats.total) {
      hintText.textContent = '今日任务全部完成 🎉';
    } else {
      hintText.textContent = '还剩 ' + (stats.total - stats.done) + ' 项任务';
    }

    catList.innerHTML = '';
    CATS.forEach(function (cat) {
      catList.appendChild(buildCatCard(cat, day, key, catList));
    });

    renderYesterday();
  }

  function buildCatCard(cat, day, key, container) {
    var items = day[cat.id] || [];
    var done = 0;
    items.forEach(function (t) { if (t.done) done++; });

    var sec = document.createElement('section');
    sec.className = 'cat-card';
    sec.dataset.cat = cat.id;
    sec.style.setProperty('--cat-color', cat.color);

    var head = document.createElement('div');
    head.className = 'cat-head';
    head.innerHTML =
      '<span class="cat-icon">' + cat.icon + '</span>' +
      '<span class="cat-name">' + cat.name + '</span>' +
      '<span class="cat-progress">' + done + '/' + items.length + '</span>';
    sec.appendChild(head);

    var bar = document.createElement('div');
    bar.className = 'mini-bar';
    var fill = document.createElement('i');
    fill.style.width = (items.length ? (done / items.length * 100) : 0) + '%';
    bar.appendChild(fill);
    sec.appendChild(bar);

    var ul = document.createElement('ul');
    ul.className = 'task-list';

    if (!items.length) {
      var li0 = document.createElement('li');
      li0.className = 'empty';
      li0.textContent = '还没有任务';
      ul.appendChild(li0);
    } else {
      // 未完成的排前面，已完成的沉底，各自保持原有顺序
      var shown = items.map(function (t, i) { return { t: t, i: i }; });
      shown.sort(function (a, b) { return (a.t.done ? 1 : 0) - (b.t.done ? 1 : 0); });
      shown.forEach(function (o) {
        var t = o.t, i = o.i;
        var li = document.createElement('li');
        li.className = 'task' + (t.done ? ' done' : '');

        var check = document.createElement('span');
        check.className = 'check';
        check.addEventListener('click', function (e) {
          e.stopPropagation();
          toggleTask(cat.id, i, key);
        });

        var txt = document.createElement('span');
        txt.className = 'task-text';
        txt.textContent = t.text;
        txt.addEventListener('click', function (e) {
          e.stopPropagation();
          startEdit(cat.id, i, txt, key);
        });

        var del = document.createElement('button');
        del.className = 'del';
        del.type = 'button';
        del.textContent = '×';
        del.setAttribute('aria-label', '删除任务');
        del.addEventListener('click', function (e) {
          e.stopPropagation();
          removeTask(cat.id, i, key);
        });

        li.appendChild(check);
        li.appendChild(txt);
        li.appendChild(del);
        attachGestures(li, cat, key, i);
        ul.appendChild(li);
      });
    }
    sec.appendChild(ul);

    var addRow = document.createElement('div');
    addRow.className = 'add-row';

    var addBtn = document.createElement('button');
    addBtn.className = 'add-btn';
    addBtn.type = 'button';
    addBtn.textContent = '+ 添加任务';

    var form = document.createElement('div');
    form.className = 'add-form hidden';

    var input = document.createElement('input');
    input.type = 'text';
    input.maxLength = 60;
    input.placeholder = '输入任务内容…';

    var okBtn = document.createElement('button');
    okBtn.className = 'add-confirm';
    okBtn.type = 'button';
    okBtn.textContent = '添加';

    form.appendChild(input);
    form.appendChild(okBtn);
    addRow.appendChild(addBtn);
    addRow.appendChild(form);
    sec.appendChild(addRow);

    addBtn.addEventListener('click', function () {
      addBtn.classList.add('hidden');
      form.classList.remove('hidden');
      input.focus();
    });

    function submit() {
      var v = input.value.trim();
      if (!v) { input.focus(); return; }
      addTask(cat.id, v, key, sec);
    }

    okBtn.addEventListener('click', submit);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        submit();
      }
    });

    return sec;
  }

  function startEdit(catId, i, textEl, key) {
    var day = getDayData(key, false);
    if (!day || !day[catId] || !day[catId][i]) return;
    var task = day[catId][i];

    var input = document.createElement('input');
    input.type = 'text';
    input.className = 'edit-input';
    input.value = task.text;
    input.maxLength = 60;

    var cancelled = false;
    var finished = false;

    textEl.replaceWith(input);
    input.focus();
    input.select();

    function saveEdit() {
      if (finished || cancelled) return;
      finished = true;
      var v = input.value.trim();
      if (v) task.text = v;
      save();
      refresh(key);
    }

    function cancelEdit() {
      if (finished || cancelled) return;
      cancelled = true;
      refresh(key);
    }

    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        input.blur();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        cancelEdit();
      }
    });

    input.addEventListener('blur', function () {
      if (!cancelled) saveEdit();
    });
  }

  function renderYesterday() {
    var y = addDays(new Date(), -1);
    var key = dayKey(y);
    var day = getDayData(key, false);
    var stats = dayStats(day);
    var pct = stats.total ? Math.round(stats.done / stats.total * 100) : 0;

    var html = '';

    html += '<div class="yhead" id="yHead">';
    html += '<div class="ytitle">📅 昨日 · ' + fmtDateWeek(y) + '</div>';
    if (stats.total) {
      html += '<div class="ytoggle">' + (yesterdayOpen ? '收起' : '展开') + '</div>';
    }
    html += '</div>';

    if (!stats.total) {
      html += '<p class="ynone">昨日没有记录任务</p>';
    } else {
      html += '<div class="yrow"><span>完成 ' + stats.done + ' / ' + stats.total + '</span>' +
              '<span class="ypct">' + pct + '%</span></div>';
      html += '<div class="bar ybar"><div class="bar-fill" style="width:' + pct + '%"></div></div>';

      html += '<div class="ycats">';
      CATS.forEach(function (cat) {
        var arr = (day && day[cat.id]) || [];
        if (!arr.length) return;
        var dn = 0;
        arr.forEach(function (t) { if (t.done) dn++; });
        html += '<span class="ychip">' + cat.icon + ' ' + cat.name + ' ' + dn + '/' + arr.length + '</span>';
      });
      html += '</div>';

      if (yesterdayOpen) {
        html += '<div class="ydetail">';
        CATS.forEach(function (cat) {
          var arr = (day && day[cat.id]) || [];
          if (!arr.length) return;
          html += '<div class="yd-cat">' + cat.icon + ' ' + cat.name + '</div>';
          arr.forEach(function (t) {
            html += '<div class="yd-item' + (t.done ? ' done' : '') + '">' +
                    '<span class="yd-dot" style="--c:' + cat.color + '"></span>' +
                    '<span>' + esc(t.text) + '</span></div>';
          });
        });
        html += '</div>';
      }
    }

    yesterdayCard.innerHTML = html;

    var head = document.getElementById('yHead');
    if (head && stats.total) {
      head.addEventListener('click', function () {
        yesterdayOpen = !yesterdayOpen;
        renderYesterday();
      });
    }
  }

  function addTask(catId, text, key, sec) {
    var d = ensureDay(key);
    d[catId].push({ text: text, done: false });
    save();
    refresh(key);

    sec = sec || catList.querySelector('.cat-card[data-cat="' + catId + '"]');
    if (sec) {
      var btn = sec.querySelector('.add-btn');
      var form = sec.querySelector('.add-form');
      var input = form ? form.querySelector('input') : null;
      if (btn && form && input) {
        btn.classList.add('hidden');
        form.classList.remove('hidden');
        input.focus();
      }
    }
  }

  function toggleTask(catId, i, key) {
    var d = getDayData(key, false);
    if (!d || !d[catId] || !d[catId][i]) return;

    var before = dayStats(d);
    d[catId][i].done = !d[catId][i].done;
    save();

    if (d[catId][i].done) vibrate(12);

    refresh(key);

    var after = dayStats(d);
    if (key === dayKey(new Date()) && after.total && after.done === after.total && before.done !== before.total) {
      toast('🎉 今日任务全部完成！');
      vibrate([20, 60, 20]);
    }
  }

  function removeTask(catId, i, key) {
    var d = getDayData(key, false);
    if (!d || !d[catId] || !d[catId][i]) return;
    d[catId].splice(i, 1);
    save();
    refresh(key);
  }

  function refresh(key) {
    if (key === dayKey(new Date())) renderToday();
    else if (modalKey === key) renderModal(key);
  }

  // ---- 长按操作菜单 ----
  var sheetEl = document.getElementById('sheet');
  var sheetMask = document.getElementById('sheetMask');
  var sheetCtx = null;

  function openSheet(cat, key, i) {
    var d = getDayData(key, false);
    var t = d && d[cat.id] && d[cat.id][i];
    if (!t) return;
    sheetCtx = { cat: cat, key: key, i: i };
    document.getElementById('sheetTitle').textContent = t.text;
    sheetEl.classList.add('show');
    sheetMask.classList.add('show');
  }

  function closeSheet() {
    sheetEl.classList.remove('show');
    sheetMask.classList.remove('show');
    sheetCtx = null;
  }

  function attachGestures(li, cat, key, i) {
    var timer = null, sx = 0, sy = 0, fired = false;

    li.addEventListener('pointerdown', function (e) {
      if (sortMode) { beginDrag(e, li, cat, key, i); return; }
      if (e.button && e.button !== 0) return;
      fired = false; sx = e.clientX; sy = e.clientY;
      timer = setTimeout(function () {
        fired = true;
        vibrate(20);
        openSheet(cat, key, i);
      }, 480);
    });
    li.addEventListener('pointermove', function (e) {
      if (timer && !fired) {
        var dx = e.clientX - sx, dy = e.clientY - sy;
        if (dx * dx + dy * dy > 144) { clearTimeout(timer); timer = null; }
      }
    });
    function cancel() { if (timer) { clearTimeout(timer); timer = null; } }
    li.addEventListener('pointerup', cancel);
    li.addEventListener('pointercancel', cancel);
    li.addEventListener('pointerleave', function () { if (!fired) cancel(); });

    // 长按呼出菜单后吞掉随后的 click，避免误触勾选/编辑
    li.addEventListener('click', function (e) {
      if (fired) { fired = false; e.stopPropagation(); e.preventDefault(); }
    }, true);

    // 桌面右键同样呼出
    li.addEventListener('contextmenu', function (e) {
      e.preventDefault();
      openSheet(cat, key, i);
    });
  }

  document.getElementById('sheetRepeat').addEventListener('click', function () {
    if (!sheetCtx) return;
    repeatWeekly(sheetCtx.cat, sheetCtx.key, sheetCtx.i);
    closeSheet();
  });
  document.getElementById('sheetSort').addEventListener('click', function () {
    if (!sheetCtx) return;
    var ctx = sheetCtx;
    closeSheet();
    if (ctx.key !== dayKey(new Date())) {
      toast('只能在「今日」页面调整顺序');
      return;
    }
    enterSortMode();
  });
  document.getElementById('sheetCancel').addEventListener('click', closeSheet);
  sheetMask.addEventListener('click', closeSheet);

  function repeatWeekly(cat, key, i) {
    var d = getDayData(key, false);
    if (!d || !d[cat.id] || !d[cat.id][i]) return;
    var task = d[cat.id][i];

    var start = new Date(key + 'T12:00:00');
    var weekEnd = addDays(startOfWeek(new Date()), 6);
    if (start > weekEnd) weekEnd = new Date(start);
    var cur = new Date(start);
    var count = 0;

    while (cur <= weekEnd) {
      var k = dayKey(cur);
      if (k !== key) {
        var d2 = ensureDay(k);
        var exists = d2[cat.id].some(function (t) { return t.text === task.text; });
        if (!exists) {
          d2[cat.id].push({ text: task.text, done: false });
          count++;
        }
      }
      cur = addDays(cur, 1);
    }
    save();
    refresh(key);
    if (currentTab === 'week') renderWeek();
    toast(count ? '已复制到本周剩余 ' + count + ' 天' : '本周剩余天数都已安排');
  }

  // ---- 排序模式 ----
  var sortMode = false;
  var sortBanner = document.getElementById('sortBanner');

  function enterSortMode() {
    sortMode = true;
    document.body.classList.add('sorting');
    sortBanner.classList.add('show');
  }
  function exitSortMode() {
    sortMode = false;
    document.body.classList.remove('sorting');
    sortBanner.classList.remove('show');
  }
  document.getElementById('sortDone').addEventListener('click', exitSortMode);

  function beginDrag(e, li, cat, key, i) {
    e.preventDefault();
    var dayData = getDayData(key, false);
    var arr = dayData && dayData[cat.id];
    if (!arr) return;

    var shown = arr.map(function (t, idx) { return { t: t, i: idx }; })
      .sort(function (a, b) { return (a.t.done ? 1 : 0) - (b.t.done ? 1 : 0); });
    var pos = -1;
    for (var s = 0; s < shown.length; s++) {
      if (shown[s].i === i) { pos = s; break; }
    }
    if (pos < 0) return;

    var undoneCount = 0;
    shown.forEach(function (o) { if (!o.t.done) undoneCount++; });
    var lo = shown[pos].t.done ? undoneCount : 0;
    var hi = shown[pos].t.done ? shown.length - 1 : undoneCount - 1;

    var ul = li.parentNode;
    var lis = Array.prototype.slice.call(ul.querySelectorAll('.task'));
    var rowH = li.offsetHeight + 7;
    var startY = e.clientY;
    var target = pos;

    li.classList.add('dragging');
    try { li.setPointerCapture(e.pointerId); } catch (err) {}

    function onMove(ev) {
      var dy = ev.clientY - startY;
      li.style.transform = 'translateY(' + dy + 'px)';
      var t = Math.max(lo, Math.min(hi, pos + Math.round(dy / rowH)));
      if (t !== target) {
        target = t;
        lis.forEach(function (el, idx) {
          if (el === li) return;
          var shift = 0;
          if (pos < target && idx > pos && idx <= target) shift = -rowH;
          else if (pos > target && idx >= target && idx < pos) shift = rowH;
          el.style.transform = shift ? 'translateY(' + shift + 'px)' : '';
        });
      }
    }
    function onUp() {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      if (target !== pos) {
        var moved = shown.splice(pos, 1)[0];
        shown.splice(target, 0, moved);
        var undoneIdx = [], doneIdx = [];
        for (var q = 0; q < arr.length; q++) {
          (arr[q].done ? doneIdx : undoneIdx).push(q);
        }
        var ui = 0, di = 0;
        shown.forEach(function (o) {
          if (o.t.done) arr[doneIdx[di++]] = o.t;
          else arr[undoneIdx[ui++]] = o.t;
        });
        save();
        vibrate(10);
      }
      renderToday();
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  }

  // ---- 周报：点击日期提前编辑 ----
  var modalKey = null;

  function openModal(key) {
    modalKey = key;
    var d = new Date(key + 'T12:00:00');
    document.getElementById('modalTitle').textContent =
      fmtDateWeek(d) + (key === dayKey(new Date()) ? ' · 今天' : '');
    renderModal(key);
    document.getElementById('dayModal').classList.add('show');
    document.getElementById('modalMask').classList.add('show');
  }

  function renderModal(key) {
    var day = getDayData(key, false) || emptyDay();
    var body = document.getElementById('modalBody');
    body.innerHTML = '';
    CATS.forEach(function (cat) {
      body.appendChild(buildCatCard(cat, day, key, body));
    });
  }

  function closeModal() {
    document.getElementById('dayModal').classList.remove('show');
    document.getElementById('modalMask').classList.remove('show');
    modalKey = null;
    renderToday();
    if (currentTab === 'week') renderWeek();
  }
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalMask').addEventListener('click', closeModal);

  function renderWeek() {
    var today = new Date();
    today.setHours(12, 0, 0, 0);

    var thisStart = startOfWeek(today);
    var thisEnd = addDays(thisStart, 6);
    var passed = Math.round((today - thisStart) / 86400000) + 1;

    var tStats = sumRange(thisStart, today);
    var lastStart = addDays(thisStart, -7);
    var lastEnd = addDays(lastStart, passed - 1);
    var lStats = sumRange(lastStart, lastEnd);

    var tPct = tStats.total ? Math.round(tStats.done / tStats.total * 100) : 0;
    var lPct = lStats.total ? Math.round(lStats.done / lStats.total * 100) : 0;

    var html = '';

    html += '<div class="card">';
    html += '<div class="card-sub">本周 · ' + fmtDate(thisStart) + ' - ' + fmtDate(thisEnd) + '</div>';
    html += '<div class="big-stat">';
    if (tStats.total) {
      html += '<div class="big-num">' + tPct + '<i>%</i></div>';
      html += '<div class="big-desc">已完成 ' + tStats.done + ' / ' + tStats.total + ' 项</div>';
    } else {
      html += '<div class="big-num">—</div>';
      html += '<div class="big-desc">本周还没有任务</div>';
    }
    html += '</div>';
    html += '<div class="bar"><div class="bar-fill" style="width:' + tPct + '%"></div></div>';
    html += '</div>';

    html += '<div class="card">';
    html += '<div class="cmp-head"><span>与上周同期对比</span>';
    if (tStats.total && lStats.total) {
      var diff = tPct - lPct;
      if (diff > 0) html += '<span class="cmp-badge up">↑ ' + diff + ' 个百分点</span>';
      else if (diff < 0) html += '<span class="cmp-badge down">↓ ' + Math.abs(diff) + ' 个百分点</span>';
      else html += '<span class="cmp-badge same">持平</span>';
    } else {
      html += '<span class="cmp-badge same">暂无对比</span>';
    }
    html += '</div>';

    html += '<div class="cmp-row"><span class="cmp-label">本周</span>' +
            '<div class="bar"><div class="bar-fill" style="width:' + tPct + '%"></div></div>' +
            '<span class="cmp-pct">' + (tStats.total ? tPct + '%' : '—') + '</span></div>';

    html += '<div class="cmp-row"><span class="cmp-label">上周同期</span>' +
            '<div class="bar last"><div class="bar-fill" style="width:' + lPct + '%"></div></div>' +
            '<span class="cmp-pct">' + (lStats.total ? lPct + '%' : '—') + '</span></div>';

    html += '<div class="cmp-note">上周同期：' + fmtDate(lastStart) + ' - ' + fmtDate(lastEnd) + '</div>';
    html += '</div>';

    html += '<div class="card">';
    html += '<div class="card-sub">本周每日完成率</div>';
    html += '<div class="week-grid">';
    for (var i = 0; i < 7; i++) {
      var d = addDays(thisStart, i);
      var k = dayKey(d);
      var s = dayStats(getDayData(k, false));
      var p = s.total ? Math.round(s.done / s.total * 100) : 0;
      var isToday = k === dayKey(today);
      var isFuture = d > today;
      var ringColor = (s.total && p === 100) ? '#4ade80' : '#60a5fa';
      var pickable = d >= today;

      html += '<div class="wday' + (isToday ? ' today' : '') + (isFuture ? ' future' : '') + (pickable ? ' pickable' : '') + '" data-date="' + k + '"' + (pickable ? ' role="button" tabindex="0"' : '') + '>';
      html += '<div class="wd-label">' + WEEK_CN[d.getDay()] + '</div>';
      html += '<div class="ring" style="--p:' + p + ';--c:' + ringColor + '">';
      html += '<span>' + (s.total ? p + '%' : '—') + '</span>';
      html += '</div>';
      html += '<div class="wd-num">' + (s.total ? s.done + '/' + s.total : '') + '</div>';
      html += '</div>';
    }
    html += '</div><div class="cmp-note">点今天及以后的日期，可提前添加任务</div></div>';

    html += '<div class="card">';
    html += '<div class="card-sub">最近 4 周</div>';
    for (var w = 3; w >= 0; w--) {
      var ws = addDays(thisStart, -7 * w);
      var we = addDays(ws, 6);
      var end = we > today ? today : we;
      var st = sumRange(ws, end);
      var wp = st.total ? Math.round(st.done / st.total * 100) : 0;

      html += '<div class="hist-row">';
      html += '<span class="hist-label">' + fmtShort(ws) + ' - ' + fmtShort(we) + (w === 0 ? ' 本周' : '') + '</span>';
      html += '<div class="hist-bar"><i style="width:' + wp + '%"></i></div>';
      html += '<span class="hist-pct">' + (st.total ? wp + '%' : '—') + '</span>';
      html += '</div>';
    }
    html += '</div>';

    weekContent.innerHTML = html;

    weekContent.querySelectorAll('.wday.pickable').forEach(function (wd) {
      wd.addEventListener('click', function () { openModal(wd.dataset.date); });
    });
  }

  document.querySelectorAll('.tabbar button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var tab = btn.dataset.tab;
      if (tab === currentTab) return;
      currentTab = tab;

      document.querySelectorAll('.tabbar button').forEach(function (b) {
        b.classList.toggle('active', b === btn);
      });
      document.querySelectorAll('.screen').forEach(function (s) {
        s.classList.toggle('hidden', s.id !== 'screen-' + tab);
      });

      if (tab === 'today') renderToday();
      if (tab === 'week') renderWeek();

      window.scrollTo(0, 0);
    });
  });

  document.getElementById('clearBtn').addEventListener('click', function () {
    if (confirm('确定清空全部任务和记录？此操作不可恢复。')) {
      closeModal();
      state = { days: {} };
      save();
      yesterdayOpen = false;
      renderToday();
      toast('已清空全部数据');
    }
  });

  // ---- 数据备份 / 恢复 ----
  function copyText(t) {
    try {
      var ta = document.createElement('textarea');
      ta.value = t;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, t.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function downloadJSON(text, name) {
    try {
      var blob = new Blob([text], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { a.remove(); URL.revokeObjectURL(url); }, 1500);
      return true;
    } catch (e) { return false; }
  }

  function applyImport(text) {
    var obj;
    try { obj = JSON.parse(text); } catch (e) { toast('备份内容解析失败'); return; }
    if (!obj || typeof obj !== 'object' || !obj.days || typeof obj.days !== 'object') {
      toast('这不是本应用的备份'); return;
    }
    var keys = Object.keys(obj.days);
    if (!keys.length) { toast('备份里没有记录'); return; }
    var over = 0;
    keys.forEach(function (k) {
      if (state.days[k]) over++;
      state.days[k] = obj.days[k];
    });
    save();
    renderToday();
    toast('已导入 ' + keys.length + ' 天记录' + (over ? '（覆盖 ' + over + ' 天）' : ''));
  }

  document.getElementById('exportBtn').addEventListener('click', function () {
    var text = JSON.stringify(state);
    var dl = downloadJSON(text, '每日任务备份-' + dayKey(new Date()) + '.json');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        toast('备份已复制，可粘贴到备忘录保存');
      }).catch(function () {
        toast(dl ? '备份文件已生成' : '导出失败，请重试');
      });
      return;
    }
    var cp = copyText(text);
    toast(cp ? '备份已复制，可粘贴到备忘录保存' : (dl ? '备份文件已生成' : '导出失败，请重试'));
  });

  document.getElementById('importBtn').addEventListener('click', function () {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json,.json';
    input.addEventListener('change', function () {
      var f = input.files && input.files[0];
      if (!f) return;
      var fr = new FileReader();
      fr.onload = function () { applyImport(String(fr.result)); };
      fr.readAsText(f);
    });
    input.click();
  });

  document.getElementById('pasteBtn').addEventListener('click', function () {
    var text = prompt('粘贴之前复制的备份内容：');
    if (text) applyImport(text);
  });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) {
      var k = dayKey(new Date());
      if (k !== lastKey) {
        yesterdayOpen = false;
        renderToday();
        if (currentTab === 'week') renderWeek();
      }
    }
  });

  setInterval(function () {
    var k = dayKey(new Date());
    if (k !== lastKey) {
      yesterdayOpen = false;
      renderToday();
      if (currentTab === 'week') renderWeek();
    }
  }, 60000);

  renderToday();
})();
</script>
</body>
</html>
